; Smart CFC — Cyanoacrylate Fuming Chamber controller

[env]
monitor_speed = 115200
build_flags = -std=gnu++17 -Wall
build_unflags = -std=gnu++11

; Shared by both ESP32 targets. `framework` deliberately does NOT live in
; [env]: env:native would inherit it and demand a board.
[esp32_base]
platform = espressif32
framework = arduino
board = esp32dev
; Two 1.9 MB app slots for over-the-air updates (no SPIFFS needed). Settings
; (NVS) sit at the same address as the default layout, so they survive.
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.13
    adafruit/Adafruit GFX Library@^1.11.11

; --- real hardware ---
[env:esp32dev]
extends = esp32_base

; --- wireless upload over the chamber's own hotspot ---
; Join the "CFC-Chamber" Wi-Fi first.
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1

; --- Wokwi simulation (no MAX6675 part exists; uses a thermal model) ---
[env:sim]
extends = esp32_base
build_flags = ${env.build_flags} -D CFC_SIM=1

; --- desktop unit tests: control logic only, no Arduino ---
[env:native]
platform = native
test_framework = unity
build_flags = ${env.build_flags} -D CFC_NATIVE=1
; src/ is not built on its own: the test includes src/main.cpp directly, and
; CFC_NATIVE strips its Arduino half.
build_src_filter = -<*>
