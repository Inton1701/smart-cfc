<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 1040" width="1420" height="1040"
     font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Smart CFC wiring diagram</title>
  <style>
    .box  { fill: #f4f6f8; stroke: #2b3440; stroke-width: 1.5; }
    .mcu  { fill: #e3ecf8; stroke: #2b3440; stroke-width: 1.8; }
    .key  { fill: #ffffff; stroke: #8a95a1; stroke-width: 1; }
    .h    { font-size: 13px; font-weight: 700; fill: #1b2430; }
    .s    { font-size: 10.5px; fill: #5b6672; }
    .t    { font-size: 11px; fill: #1b2430; }
    .tu   { font-size: 11px; fill: #aab2bb; }
    .k    { font-size: 8px; fill: #1b2430; text-anchor: middle; }
    .e    { text-anchor: end; }
    .c    { text-anchor: middle; }
    .p    { fill: #ffffff; stroke: #1b2430; stroke-width: 1.4; }
    .pu   { fill: #ffffff; stroke: #aab2bb; stroke-width: 1.2; }
    .w    { fill: none; stroke-width: 2.3; stroke-linejoin: round; stroke-linecap: round; }
    .st   { fill: none; stroke: #546e7a; stroke-width: 1.8; stroke-linecap: round; }
    .m    { fill: none; stroke-width: 3.8; stroke-linejoin: round; stroke-linecap: round; }
    .dot  { fill: #1b2430; }
  </style>
  <defs>
    <g id="p5"><rect y="-8" width="36" height="16" rx="8" fill="#d32f2f"/><text x="18" y="3.6" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">+5V</text></g>
    <g id="p3"><rect y="-8" width="36" height="16" rx="8" fill="#e65100"/><text x="18" y="3.6" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3V3</text></g>
    <g id="pg"><rect y="-8" width="36" height="16" rx="8" fill="#263238"/><text x="18" y="3.6" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">GND</text></g>
  </defs>

  <rect width="1420" height="1040" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#1b2430">Smart CFC — wiring diagram</text>
  <text x="40" y="66" font-size="12" fill="#5b6672">Low-voltage side on top, 220 V mains at the bottom. Pin numbers match the Config section of src/main.cpp.</text>

  <!-- mains zone -->
  <rect x="30" y="720" width="1140" height="290" rx="10" fill="#fff5f5" stroke="#c62828" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="46" y="1000" font-size="11" font-weight="700" fill="#b71c1c">MAINS SIDE · 220 V AC, NO EARTH — plug in only through a 30 mA RCD/GFCI. Keep the plate insulated from the rack, legs and probe.</text>

  <!-- ===== signal wires ===== -->
  <g class="w" stroke="#78909c">
    <path d="M260 290 H590"/>
    <path d="M260 320 H590"/>
    <path d="M260 380 H590"/>
    <path d="M260 410 H590"/>
    <path d="M260 440 H470 V500 H590"/>
  </g>
  <path class="w" stroke="#fb8c00" d="M590 350 H505 V625 H690 V660"/>
  <path class="w" stroke="#fb8c00" d="M690 625 H712"/>
  <path class="w" stroke="#546e7a" d="M748 625 H770 V660"/>
  <path class="w" stroke="#795548" d="M810 140 H1000"/>
  <path class="w" stroke="#d81b60" d="M810 170 H880 V235 H1000"/>
  <path class="w" stroke="#00897b" d="M810 260 H1000"/>
  <path class="w" stroke="#1565c0" d="M810 290 H960 V405 H1000"/>
  <path class="w" stroke="#f9a825" d="M810 320 H930 V435 H1000"/>
  <path class="w" stroke="#2e7d32" d="M810 350 H900 V465 H1000"/>
  <path class="w" stroke="#6a1b9a" d="M810 440 H885 V550 H1000"/>
  <path class="w" stroke="#d32f2f" d="M1180 150 H1270"/>
  <path class="w" stroke="#37474f" d="M1180 455 H1270"/>
  <path class="w" stroke="#37474f" d="M1180 480 H1270"/>

  <!-- stubs to power tags -->
  <g class="st">
    <path d="M575 530 H590"/><path d="M575 560 H590"/>
    <path d="M810 530 H825"/><path d="M810 560 H825"/>
    <path d="M260 470 H275"/>
    <path d="M380 660 V645"/><path d="M450 660 V645"/>
    <path d="M985 105 H1000"/><path d="M985 175 H1000"/><path d="M1180 110 H1195"/>
    <path d="M1255 185 H1270"/>
    <path d="M1180 245 H1195"/><path d="M1180 275 H1195"/>
    <path d="M1180 400 H1195"/><path d="M1180 425 H1195"/>
    <path d="M985 580 H1000"/>
    <path d="M770 625 H790"/>
  </g>

  <!-- ===== mains wires ===== -->
  <g class="m" stroke="#8d4a1f">
    <path d="M140 880 H190"/>
    <path d="M340 880 H500"/>
    <path d="M570 880 H590"/>
    <path d="M660 880 H690 V780"/>
    <path d="M380 880 V780"/>
    <path d="M770 780 V880 H900"/>
  </g>
  <g class="m" stroke="#1565c0">
    <path d="M140 950 H190"/>
    <path d="M340 950 H900"/>
    <path d="M450 950 V780"/>
  </g>

  <!-- ===== wire colour key ===== -->
  <rect class="box" x="60" y="95" width="480" height="125" rx="6" fill="#ffffff"/>
  <text class="h" x="75" y="117">Wire colours</text>
  <g class="w">
    <path stroke="#fb8c00" d="M75 136 H101"/><path stroke="#78909c" d="M75 156 H101"/>
    <path stroke="#6a1b9a" d="M75 176 H101"/><path stroke="#795548" d="M75 196 H101"/>
    <path stroke="#00897b" d="M225 136 H251"/><path stroke="#d81b60" d="M225 156 H251"/>
    <path stroke="#d32f2f" d="M225 176 H251"/><path stroke="#37474f" d="M225 196 H251"/>
    <path stroke="#1565c0" d="M380 136 H406"/><path stroke="#f9a825" d="M380 156 H406"/>
    <path stroke="#2e7d32" d="M380 176 H406"/>
  </g>
  <g class="t">
    <text x="109" y="140">D25 → SSR input</text>
    <text x="109" y="160">keypad keys</text>
    <text x="109" y="180">D4 → buzzer</text>
    <text x="109" y="200">D23 → relay IN</text>
    <text x="259" y="140">D21 → OLED SDA</text>
    <text x="259" y="160">D22 → OLED SCL</text>
    <text x="259" y="180">relay NO → fan +</text>
    <text x="259" y="200">thermocouple leads</text>
    <text x="414" y="140">D19 → MAX6675 SO</text>
    <text x="414" y="160">D18 → MAX6675 SCK</text>
    <text x="414" y="180">D5 → MAX6675 CS</text>
  </g>

  <!-- ===== ESP32 ===== -->
  <rect class="mcu" x="590" y="110" width="220" height="480" rx="8"/>
  <rect x="675" y="582" width="50" height="14" rx="3" fill="#8a95a1"/>
  <text x="700" y="593" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">USB</text>
  <text x="700" y="335" font-size="15" font-weight="700" fill="#1b2430" text-anchor="middle">ESP32 DevKit</text>
  <text class="s c" x="700" y="353">30-pin, ESP32-WROOM-32</text>

  <g class="tu">
    <text x="600" y="144">EN</text><text x="600" y="174">VP</text><text x="600" y="204">VN</text>
    <text x="600" y="234">D34</text><text x="600" y="264">D35</text>
    <text x="600" y="444">D14</text><text x="600" y="474">D12</text>
    <text class="e" x="800" y="204">TX0</text><text class="e" x="800" y="234">RX0</text>
    <text class="e" x="800" y="384">TX2</text><text class="e" x="800" y="414">RX2</text>
    <text class="e" x="800" y="474">D2</text><text class="e" x="800" y="504">D15</text>
  </g>
  <g class="t" font-weight="700">
    <text x="600" y="294">D32</text><text x="600" y="324">D33</text><text x="600" y="354">D25</text>
    <text x="600" y="384">D26</text><text x="600" y="414">D27</text><text x="600" y="504">D13</text>
    <text x="600" y="534">GND</text><text x="600" y="564">VIN</text>
    <text class="e" x="800" y="144">D23</text><text class="e" x="800" y="174">D22</text>
    <text class="e" x="800" y="264">D21</text><text class="e" x="800" y="294">D19</text>
    <text class="e" x="800" y="324">D18</text><text class="e" x="800" y="354">D5</text>
    <text class="e" x="800" y="444">D4</text><text class="e" x="800" y="534">GND</text>
    <text class="e" x="800" y="564">3V3</text>
  </g>
  <g class="pu">
    <circle cx="590" cy="140" r="2.8"/><circle cx="590" cy="170" r="2.8"/><circle cx="590" cy="200" r="2.8"/>
    <circle cx="590" cy="230" r="2.8"/><circle cx="590" cy="260" r="2.8"/>
    <circle cx="590" cy="440" r="2.8"/><circle cx="590" cy="470" r="2.8"/>
    <circle cx="810" cy="200" r="2.8"/><circle cx="810" cy="230" r="2.8"/>
    <circle cx="810" cy="380" r="2.8"/><circle cx="810" cy="410" r="2.8"/>
    <circle cx="810" cy="470" r="2.8"/><circle cx="810" cy="500" r="2.8"/>
  </g>
  <g class="p">
    <circle cx="590" cy="290" r="3.6"/><circle cx="590" cy="320" r="3.6"/><circle cx="590" cy="350" r="3.6"/>
    <circle cx="590" cy="380" r="3.6"/><circle cx="590" cy="410" r="3.6"/><circle cx="590" cy="500" r="3.6"/>
    <circle cx="590" cy="530" r="3.6"/><circle cx="590" cy="560" r="3.6"/>
    <circle cx="810" cy="140" r="3.6"/><circle cx="810" cy="170" r="3.6"/><circle cx="810" cy="260" r="3.6"/>
    <circle cx="810" cy="290" r="3.6"/><circle cx="810" cy="320" r="3.6"/><circle cx="810" cy="350" r="3.6"/>
    <circle cx="810" cy="440" r="3.6"/><circle cx="810" cy="530" r="3.6"/><circle cx="810" cy="560" r="3.6"/>
  </g>
  <use href="#pg" x="539" y="530"/><use href="#p5" x="539" y="560"/>
  <use href="#pg" x="825" y="530"/><use href="#p3" x="825" y="560"/>

  <!-- ===== keypad ===== -->
  <rect class="box" x="60" y="240" width="200" height="260" rx="6"/>
  <text class="h" x="72" y="261">5-key membrane keypad</text>
  <text class="s" x="72" y="276">1 common + 5 key lines</text>
  <g>
    <rect class="key" x="109" y="355" width="32" height="22" rx="4"/><text class="k" x="125" y="369">INC</text>
    <rect class="key" x="71"  y="389" width="32" height="22" rx="4"/><text class="k" x="87"  y="403">STORE</text>
    <rect class="key" x="109" y="389" width="32" height="22" rx="11"/><text class="k" x="125" y="403">SEL</text>
    <rect class="key" x="147" y="389" width="32" height="22" rx="4"/><text class="k" x="163" y="403">NEXT</text>
    <rect class="key" x="109" y="423" width="32" height="22" rx="4"/><text class="k" x="125" y="437">DEC</text>
  </g>
  <g class="t e">
    <text x="250" y="294">INC</text><text x="250" y="324">DEC</text><text x="250" y="384">NEXT</text>
    <text x="250" y="414">STORE</text><text x="250" y="444">SEL</text><text x="250" y="474">COM</text>
  </g>
  <g class="p">
    <circle cx="260" cy="290" r="3.6"/><circle cx="260" cy="320" r="3.6"/><circle cx="260" cy="380" r="3.6"/>
    <circle cx="260" cy="410" r="3.6"/><circle cx="260" cy="440" r="3.6"/><circle cx="260" cy="470" r="3.6"/>
  </g>
  <use href="#pg" x="275" y="470"/>

  <!-- ===== 5 V supply ===== -->
  <rect class="box" x="330" y="660" width="170" height="120" rx="6"/>
  <text class="h c" x="415" y="716">5 V power supply</text>
  <text class="s c" x="415" y="731">220 V AC → 5 V DC</text>
  <text class="t c" x="380" y="678">+5V</text><text class="t c" x="450" y="678">GND</text>
  <text class="t c" x="380" y="771">AC L</text><text class="t c" x="450" y="771">AC N</text>
  <g class="p">
    <circle cx="380" cy="660" r="3.6"/><circle cx="450" cy="660" r="3.6"/>
    <circle cx="380" cy="780" r="3.6"/><circle cx="450" cy="780" r="3.6"/>
  </g>
  <use href="#p5" x="362" y="637"/><use href="#pg" x="432" y="637"/>

  <!-- ===== SSR + pulldown ===== -->
  <rect class="box" x="640" y="660" width="180" height="120" rx="6"/>
  <text class="h c" x="730" y="716">SSR-40 DA</text>
  <text class="s c" x="730" y="731">solid state relay</text>
  <text class="t c" x="690" y="678">3 +</text><text class="t c" x="770" y="678">4 −</text>
  <text class="t c" x="690" y="771">1 ~</text><text class="t c" x="770" y="771">2 ~</text>
  <g class="p">
    <circle cx="690" cy="660" r="3.6"/><circle cx="770" cy="660" r="3.6"/>
    <circle cx="690" cy="780" r="3.6"/><circle cx="770" cy="780" r="3.6"/>
  </g>
  <rect x="712" y="618" width="36" height="14" rx="2" fill="#ffffff" stroke="#2b3440" stroke-width="1.5"/>
  <text class="s c" x="730" y="612">R1 10 kΩ</text>
  <circle class="dot" cx="690" cy="625" r="4"/><circle class="dot" cx="770" cy="625" r="4"/>
  <use href="#pg" x="790" y="625"/>

  <!-- ===== relay + fan ===== -->
  <rect class="box" x="1000" y="80" width="180" height="115" rx="6"/>
  <text class="h c" x="1090" y="98">5 V relay module</text>
  <text class="s c" x="1090" y="133">switches the fan</text>
  <text class="t" x="1010" y="109">VCC</text><text class="t" x="1010" y="144">IN</text><text class="t" x="1010" y="179">GND</text>
  <text class="t e" x="1170" y="114">COM</text><text class="t e" x="1170" y="154">NO</text><text class="tu e" x="1170" y="184">NC</text>
  <g class="p">
    <circle cx="1000" cy="105" r="3.6"/><circle cx="1000" cy="140" r="3.6"/><circle cx="1000" cy="175" r="3.6"/>
    <circle cx="1180" cy="110" r="3.6"/><circle cx="1180" cy="150" r="3.6"/>
  </g>
  <circle class="pu" cx="1180" cy="180" r="2.8"/>
  <use href="#p5" x="949" y="105"/><use href="#pg" x="949" y="175"/><use href="#p5" x="1195" y="110"/>

  <rect class="box" x="1270" y="125" width="130" height="85" rx="6"/>
  <text class="h c" x="1345" y="163">40 mm fan</text>
  <text class="s c" x="1345" y="178">5 V</text>
  <text class="t" x="1280" y="154">+</text><text class="t" x="1280" y="189">−</text>
  <g class="p"><circle cx="1270" cy="150" r="3.6"/><circle cx="1270" cy="185" r="3.6"/></g>
  <use href="#pg" x="1219" y="185"/>

  <!-- ===== OLED ===== -->
  <rect class="box" x="1000" y="215" width="180" height="125" rx="6"/>
  <text class="h c" x="1090" y="308">2.42″ OLED</text>
  <text class="s c" x="1090" y="323">128×64 · I2C 0x3C</text>
  <text class="t" x="1010" y="239">SCL</text><text class="t" x="1010" y="264">SDA</text>
  <text class="t e" x="1170" y="249">VCC</text><text class="t e" x="1170" y="279">GND</text>
  <g class="p">
    <circle cx="1000" cy="235" r="3.6"/><circle cx="1000" cy="260" r="3.6"/>
    <circle cx="1180" cy="245" r="3.6"/><circle cx="1180" cy="275" r="3.6"/>
  </g>
  <use href="#p3" x="1195" y="245"/><use href="#pg" x="1195" y="275"/>

  <!-- ===== MAX6675 + probe ===== -->
  <rect class="box" x="1000" y="380" width="180" height="125" rx="6"/>
  <text class="h c" x="1085" y="497">MAX6675 (HW-550)</text>
  <text class="t" x="1010" y="409">SO</text><text class="t" x="1010" y="439">SCK</text><text class="t" x="1010" y="469">CS</text>
  <text class="t e" x="1170" y="404">VCC</text><text class="t e" x="1170" y="429">GND</text>
  <text class="t e" x="1170" y="459">T+</text><text class="t e" x="1170" y="484">T−</text>
  <g class="p">
    <circle cx="1000" cy="405" r="3.6"/><circle cx="1000" cy="435" r="3.6"/><circle cx="1000" cy="465" r="3.6"/>
    <circle cx="1180" cy="400" r="3.6"/><circle cx="1180" cy="425" r="3.6"/>
    <circle cx="1180" cy="455" r="3.6"/><circle cx="1180" cy="480" r="3.6"/>
  </g>
  <use href="#p3" x="1195" y="400"/><use href="#pg" x="1195" y="425"/>

  <rect class="box" x="1270" y="435" width="130" height="65" rx="6"/>
  <text class="h c" x="1345" y="465">K-type probe</text>
  <text class="s c" x="1345" y="480">thermocouple</text>
  <text class="t" x="1280" y="459">+</text><text class="t" x="1280" y="484">−</text>
  <g class="p"><circle cx="1270" cy="455" r="3.6"/><circle cx="1270" cy="480" r="3.6"/></g>

  <!-- ===== buzzer ===== -->
  <rect class="box" x="1000" y="520" width="130" height="80" rx="6"/>
  <text class="h c" x="1080" y="558">5 V buzzer</text>
  <text class="s c" x="1080" y="573">active type</text>
  <text class="t" x="1010" y="554">+</text><text class="t" x="1010" y="584">−</text>
  <g class="p"><circle cx="1000" cy="550" r="3.6"/><circle cx="1000" cy="580" r="3.6"/></g>
  <use href="#pg" x="949" y="580"/>

  <!-- ===== mains parts ===== -->
  <rect class="box" x="50" y="850" width="90" height="130" rx="6"/>
  <text class="h c" x="88" y="912">Plug</text>
  <text class="s c" x="88" y="927">via RCD</text>
  <text class="t e" x="130" y="884">L</text><text class="t e" x="130" y="954">N</text>
  <g class="p"><circle cx="140" cy="880" r="3.6"/><circle cx="140" cy="950" r="3.6"/></g>

  <rect class="box" x="190" y="850" width="150" height="130" rx="6"/>
  <text class="h c" x="265" y="912">AC inlet</text>
  <text class="s c" x="265" y="927">3 A fuse + switch</text>
  <text class="t" x="200" y="884">L</text><text class="t" x="200" y="954">N</text>
  <text class="t e" x="330" y="884">L out</text><text class="t e" x="330" y="954">N</text>
  <g class="p">
    <circle cx="190" cy="880" r="3.6"/><circle cx="190" cy="950" r="3.6"/>
    <circle cx="340" cy="880" r="3.6"/><circle cx="340" cy="950" r="3.6"/>
  </g>

  <rect class="box" x="500" y="866" width="70" height="28" rx="4" fill="#ffffff"/>
  <rect class="box" x="590" y="866" width="70" height="28" rx="4" fill="#ffffff"/>
  <text class="h c" x="535" y="885">F1</text><text class="h c" x="625" y="885">F2</text>
  <text class="s c" x="580" y="911">thermal fuses, clamped</text>
  <text class="s c" x="580" y="924">to the heating plate</text>

  <rect class="box" x="900" y="850" width="180" height="130" rx="6"/>
  <text class="h c" x="1005" y="905">Heating pad</text>
  <text class="s c" x="1005" y="920">300 W · 220 V</text>
  <text class="s c" x="1005" y="940">plate insulated from</text>
  <text class="s c" x="1005" y="953">rack, legs and probe</text>
  <text class="t" x="910" y="884">lead 1</text><text class="t" x="910" y="954">lead 2</text>
  <g class="p"><circle cx="900" cy="880" r="3.6"/><circle cx="900" cy="950" r="3.6"/></g>

  <circle class="dot" cx="380" cy="880" r="4.5"/><circle class="dot" cx="450" cy="950" r="4.5"/>

  <!-- ===== legend ===== -->
  <rect class="box" x="1190" y="640" width="210" height="370" rx="6" fill="#ffffff"/>
  <text class="h" x="1204" y="663">Legend</text>
  <use href="#p5" x="1204" y="688"/><text class="t" x="1258" y="692">5 V from the supply</text>
  <use href="#p3" x="1204" y="712"/><text class="t" x="1258" y="716">3.3 V from ESP32</text>
  <use href="#pg" x="1204" y="736"/><text class="t" x="1258" y="740">ground</text>
  <text class="s" x="1204" y="770">Tags with the same name are</text>
  <text class="s" x="1204" y="784">one wire. Join them all.</text>
  <path class="m" stroke="#8d4a1f" d="M1204 828 H1240"/><text class="t" x="1250" y="832">mains live (L)</text>
  <path class="m" stroke="#1565c0" d="M1204 850 H1240"/><text class="t" x="1250" y="854">mains neutral (N)</text>
  <path class="w" stroke="#78909c" d="M1204 872 H1240"/><text class="t" x="1250" y="876">low-voltage signal</text>
  <circle class="dot" cx="1222" cy="896" r="4"/><text class="t" x="1250" y="900">wires join only here</text>
  <circle class="pu" cx="1222" cy="918" r="2.8"/><text class="t" x="1250" y="922">pin not used</text>
  <text class="s" x="1204" y="950">Crossing lines with no dot</text>
  <text class="s" x="1204" y="964">are not connected.</text>
  <text class="s" x="1204" y="986">Check the labels printed on</text>
  <text class="s" x="1204" y="1000">your own board and modules.</text>
</svg>
